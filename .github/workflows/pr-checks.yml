name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check

  size:
    name: Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - run: corepack enable
      - run: yarn install --immutable
      - uses: gerbal/package-size-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
